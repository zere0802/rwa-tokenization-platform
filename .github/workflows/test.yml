name: Foundry CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Dependencies
        run: forge install

      - name: Check formatting (forge fmt)
        run: forge fmt --check

      - name: Build
        run: forge build

      - name: Run Tests
        run: forge test -vvv

      - name: Coverage
        run: forge coverage --no-match-coverage "script/*"

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install solhint
        run: npm install -g solhint

      - name: Run solhint
        run: solhint 'contracts/**/*.sol' --max-warnings 50

      - name: Install frontend deps
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Prettier check (frontend)
        working-directory: frontend
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,css}"

  slither:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Install Dependencies
        run: forge install

      - name: Build
        run: forge build

      - name: Run Slither
        run: slither . --foundry-out-directory out --filter-paths "lib/" --exclude-low --exclude-informational || true