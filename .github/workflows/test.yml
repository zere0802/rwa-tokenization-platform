name: Foundry CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Dependencies
        run: forge install

      - name: Build
        run: forge build

      - name: Run Tests
        run: forge test -vv

      - name: Coverage
        run: forge coverage --no-match-coverage "script/*"